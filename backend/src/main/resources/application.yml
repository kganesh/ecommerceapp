spring:
  application:
    name: ecommerceapp
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Label photos (FR-16): the client resizes to well under this; the service enforces 3.5 MB.
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    redis:
      namespace: ecommerceapp:session
  security:
    oauth2:
      client:
        # Backend-for-frontend login (D11). Endpoints are configured explicitly (no
        # discovery at startup): the browser reaches the identity provider at
        # OIDC_BROWSER_BASE, while the backend calls it at OIDC_INTERNAL_BASE.
        # Defaults target the local Keycloak in compose.yaml; AWS sets them for Cognito (M5).
        registration:
          idp:
            provider: idp
            client-id: ${OIDC_CLIENT_ID:ecommerce-bff}
            client-secret: ${OIDC_CLIENT_SECRET:local-dev-bff-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: ${app.public-base-url}/login/oauth2/code/{registrationId}
        provider:
          idp:
            # Full URIs can be set directly (Cognito on AWS); the defaults build Keycloak's paths.
            authorization-uri: ${OIDC_AUTHORIZATION_URI:${OIDC_BROWSER_BASE:http://localhost:8180}/realms/ecommerce/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:${OIDC_INTERNAL_BASE:http://localhost:8180}/realms/ecommerce/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWK_SET_URI:${OIDC_INTERNAL_BASE:http://localhost:8180}/realms/ecommerce/protocol/openid-connect/certs}
            # No user-info-uri on purpose: username, email and roles come from the signed ID
            # token. Calling UserInfo over the internal URL fails when the identity provider
            # issued the token under the browser URL (Codespaces, any proxy): 401.
            # Keycloak: preferred_username. Cognito: email (its ID token has no preferred_username).
            user-name-attribute: ${OIDC_USER_NAME_ATTRIBUTE:preferred_username}

app:
  # Origin the browser uses for the SPA (Vite locally, CloudFront on AWS).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  oidc:
    end-session-uri: ${OIDC_END_SESSION_URI:${OIDC_BROWSER_BASE:http://localhost:8180}/realms/ecommerce/protocol/openid-connect/logout}
    # ID-token claim holding the user's roles (Keycloak mapper: "roles"; Cognito: "cognito:groups").
    roles-claim: ${OIDC_ROLES_CLAIM:roles}
  payments:
    # "test" accepts only test tokens (tok_test_approve / tok_test_decline). The real
    # hosted provider is chosen before M5 (spec: Items awaiting sign-off).
    provider: ${PAYMENTS_PROVIDER:test}
  ai:
    # "disabled" (default) or "bedrock". Bedrock uses the standard AWS credential chain
    # and AWS_REGION; the model must be enabled in that account (spec: AI assist, D19).
    provider: ${AI_PROVIDER:disabled}
    model-id: ${AI_MODEL_ID:us.anthropic.claude-sonnet-5-5}

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
