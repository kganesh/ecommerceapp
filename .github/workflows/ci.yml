name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload generated OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: backend/target/openapi.generated.json
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts \
            || (echo "::error::frontend/src/api/schema.d.ts is stale. Run 'make openapi' and commit." && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  local-stack:
    name: Local stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: docker compose --profile app --profile prod config --quiet
      - name: Validate Keycloak realm and Toxiproxy JSON
        run: |
          python3 -m json.tool local/keycloak/ecommerce-realm.json > /dev/null
          python3 -m json.tool local/toxiproxy/toxiproxy.json > /dev/null

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  prod-like:
    # M5 local gate in CI: production images behind the prod-like web tier, then the
    # Playwright suite (including the accessibility scan) and the k6 load test.
    name: Prod-like stack (e2e, accessibility, load)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production images
        run: make image image-web
      - name: Start the prod-like stack
        run: docker compose --profile prod up -d postgres redis keycloak backend web
      - name: Wait for backend and identity provider
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8081/actuator/health | grep -q '"UP"' \
               && curl -fsS -o /dev/null http://localhost:8180/realms/ecommerce/.well-known/openid-configuration; then
              echo "stack is up"; exit 0
            fi
            sleep 4
          done
          docker compose --profile prod logs --tail=200 backend keycloak
          exit 1
      - name: Load seed data
        run: make seed
      - name: Install Playwright
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: End-to-end and accessibility
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npx playwright test
      - uses: grafana/setup-k6-action@v1
      - name: Load test (10 req/s)
        run: k6 run -e BASE_URL=http://localhost:8081 -e DURATION=1m load/shop.js
      - name: Page snapshots of failed tests
        if: failure()
        run: for f in frontend/test-results/*/error-context.md; do echo "=== $f"; head -c 6000 "$f"; done || true
      - name: Backend logs
        if: failure()
        run: docker compose --profile prod logs --tail=300 backend web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
