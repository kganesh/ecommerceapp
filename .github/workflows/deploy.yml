name: Deploy

# Manual deploy to AWS (M5). One-time setup, after `terraform apply` in infra/terraform:
# create a GitHub environment named "production" (add required reviewers) with these
# variables, taken from the Terraform outputs:
#   AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URL, ECS_CLUSTER, ECS_SERVICE, ECS_TASK_FAMILY,
#   WEB_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Test, build and push the backend image
        working-directory: backend
        run: |
          mvn -B -ntp verify
          mvn -B -ntp spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName="$IMAGE"
          docker push "$IMAGE"

      - name: Current task definition
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ env.IMAGE }}
      - name: Roll out the backend (rolls back automatically if it fails health checks)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Build and publish the SPA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          aws s3 sync dist/assets "s3://${{ vars.WEB_BUCKET }}/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" --delete --exclude "assets/*" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/"
