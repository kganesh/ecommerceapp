# Same routing CloudFront does on AWS: one origin for the browser, API paths to the backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Label photos (FR-16) are resized in the browser; the backend enforces 3.5 MB.
    client_max_body_size 6m;

    location ~ ^/(api|oauth2|login|logout)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Only the health endpoint is public; other actuator endpoints stay internal.
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri /index.html;
    }
}
